workflows:
  android-workflow:
    name: Native Android APK Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    scripts:
      - name: Set Execute Permission
        script: |
          chmod +x gradlew
      - name: Build Android APK
        script: |
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      
